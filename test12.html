<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Calliope Steuerung</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh; gap: 20px;
           background: #1a1a2e; color: white; }
    h1 { font-size: 2rem; }
    button { padding: 20px 40px; font-size: 1.5rem; border-radius: 12px;
             cursor: pointer; border: none; color: white; }
    #connectBtn { background: #555; }
    #startBtn   { background: #2ecc71; }
    #stopBtn    { background: #e74c3c; }
    #status     { color: #aaa; font-size: 1rem; }
    .buttons    { display: flex; gap: 20px; }
  </style>
</head>
<body>
  <h1>🤖 Minenfeld-Roboter</h1>
  <p id="status">Nicht verbunden</p>
  <button id="connectBtn" onclick="connect()">🔵 Verbinden</button>
  <div class="buttons">
    <button id="startBtn" onclick="send('START')" disabled>▶️ START</button>
    <button id="stopBtn"  onclick="send('STOP')"  disabled>⏹ STOP</button>
  </div>

<script>
  const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const UART_TX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  let txCharacteristic = null;

  async function connect() {
    try {
      document.getElementById('status').textContent = '🔄 Suche Calliope...';
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'Calliope' }],
        optionalServices: [UART_SERVICE]
      });
      const server  = await device.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE);
      txCharacteristic = await service.getCharacteristic(UART_TX_CHAR);
      document.getElementById('status').textContent = '✅ Verbunden mit: ' + device.name;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled  = false;
      document.getElementById('connectBtn').textContent = '🔵 Neu verbinden';
    } catch (err) {
      document.getElementById('status').textContent = '❌ Fehler: ' + err;
    }
  }

  async function send(command) {
    if (!txCharacteristic) return;
    const encoder = new TextEncoder();
    await txCharacteristic.writeValue(encoder.encode(command + '\n'));
  }
</script>
</body>
</html>
